name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest  

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # FIX 1: Safely pass the secret via 'env' and validate it is not empty
      - name: Decode Keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 || vars.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is empty or missing on GitHub! Please add it in Settings > Secrets > Actions."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > ${{ github.workspace }}/safevoice.jks
          
          if [ ! -s ${{ github.workspace }}/safevoice.jks ]; then
            echo "::error::The decoded keystore file is empty (0 bytes). Check your Base64 encoding."
            exit 1
          fi
          echo "Keystore successfully decoded. Size: $(wc -c < ${{ github.workspace }}/safevoice.jks) bytes"

      # FIX 2: Safeguard the printing step so empty environment credentials don't hang the runner
      - name: Print Keystore SHA Fingerprints
        env:
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS || 'fastgit' }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEYSTORE_PASSWORD is not set! Skipping fingerprint generation."
            exit 1
          fi
          keytool -list -v \
            -keystore ${{ github.workspace }}/safevoice.jks \
            -alias "$KEY_ALIAS" \
            -storepass "$KEYSTORE_PASSWORD"

      # Setup Gradle with cache-disabled to force clean recompilation with updated rules
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.1
          cache-disabled: true

      # Generate a fresh, uncorrupted Gradle wrapper binary using Gradle 9.3.1
      - name: Regenerate Gradle Wrapper
        run: gradle wrapper

      # Grant execute permission to the Gradle wrapper script
      - name: Make Gradlew Executable
        run: chmod +x gradlew

      # --- OPENSLL AES-256 IN-MEMORY PAYLOAD ENCRYPTION STEP ---
      - name: Build and Encrypt Core Payload
        env:
          PAYLOAD_PASSPHRASE: "FastGit_Master_Secret_2026"
        run: |
          mkdir -p app/src/main/assets
          mkdir -p build/payload_dex

          # 1. Clean and force fresh compilation without using old cached binaries
          ./gradlew clean compileReleaseSources --no-build-cache

          # 2. Locate Android D8 build tool and platform SDK
          D8_TOOL=$(find $ANDROID_HOME/build-tools -name d8 | sort -V | tail -n 1)
          PLATFORM_JAR=$(find $ANDROID_HOME/platforms -name "android.jar" | sort -V | tail -n 1)
          echo "Found D8 Tool at: $D8_TOOL"
          echo "Found Platform JAR at: $PLATFORM_JAR"

          # 3. Dynamically search all compiled release class files in app/build (excluding tests and StubApplication)
          CLASS_FILES=$(find app/build -type f -name "*.class" ! -name "StubApplication*" ! -path "*/test*" ! -path "*/androidTest*")

          if [ -z "$CLASS_FILES" ]; then
            echo "::error::No compiled class files found in app/build!"
            exit 1
          fi

          echo "Packaging $(echo "$CLASS_FILES" | wc -w) class files into payload DEX..."

          # 4. Compile classes into standalone payload DEX with min-api 26 matching app minSdk
          $D8_TOOL --lib "$PLATFORM_JAR" --min-api 26 --release --output build/payload_dex $CLASS_FILES

          # 5. Encrypt payload DEX with OpenSSL AES-256-CBC PBKDF2
          openssl enc -aes-256-cbc -salt -pbkdf2 \
            -in build/payload_dex/classes.dex \
            -out app/src/main/assets/payload.bin \
            -k "$PAYLOAD_PASSPHRASE"

          # 6. Purge the unencrypted intermediate DEX file from runner storage
          rm -rf build/payload_dex
          echo "Payload DEX successfully encrypted into app/src/main/assets/payload.bin"

      # FIX 3: Build Release APK cleanly without stale build cache
      - name: Build Release APK
        run: ./gradlew assembleRelease --no-build-cache
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/safevoice.jks
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD || vars.KEYSTORE_PASSWORD }}
          KEY_PASSWORD:  ${{ secrets.KEY_PASSWORD || vars.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS || vars.KEY_ALIAS || 'fastgit' }}

      # FIX 4: Upload generated release APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/*.apk